name: tuttoseriea-local

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_DB: tuttoseriea_local
      POSTGRES_USER: tuttoseriea_local
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD in root .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - tuttoseriea_local_postgres_data:/var/lib/postgresql
    networks:
      - tuttoseriea_local
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  tuttoseriea_local_postgres_data:
    name: tuttoseriea_local_postgres_data

networks:
  tuttoseriea_local:
    name: tuttoseriea_local
