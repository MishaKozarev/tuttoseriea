name: Verify Staging

run-name: Verify STAGING ${{ inputs.git_sha }}

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: 40-character commit SHA approved by manual STAGING OK
        required: true
        type: string
      image_digest:
        description: Immutable GHCR digest for ghcr.io/mishakozarev/tuttoseriea/web:sha-<git_sha>
        required: true
        type: string

permissions:
  contents: read
  deployments: write
  packages: read

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  verify-staging:
    name: Verify Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.tuttoseriea.com/
    env:
      VERIFY_GIT_SHA: ${{ inputs.git_sha }}
      VERIFY_IMAGE_DIGEST: ${{ inputs.image_digest }}
      WEB_IMAGE: ghcr.io/mishakozarev/tuttoseriea/web
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
      STAGING_SSH_PORT: "56777"
      STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      STAGING_SSH_USER: deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login --username "${{ github.actor }}" --password-stdin ghcr.io

      - name: Record verified staging release
        shell: bash
        run: bash scripts/verify-staging.sh
