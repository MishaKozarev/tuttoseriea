name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_DB: tuttoseriea_ci
          POSTGRES_USER: tuttoseriea_ci
          POSTGRES_PASSWORD: tuttoseriea_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tuttoseriea_ci -d tuttoseriea_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python for AI service contract
        uses: actions/setup-python@v7
        with:
          python-version-file: ai-service/.python-version

      - name: Set up uv for AI service contract
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install AI service dependencies for contract export
        working-directory: ai-service
        run: uv sync --locked

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.23.0
          runtime: node@24
          package-json-file: web/package.json
          install: false
          cache: true
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Check AI service OpenAPI contract drift
        working-directory: web
        run: pnpm run ai:contract:check

      - name: Test web
        working-directory: web
        run: pnpm run test

      - name: Install Playwright browser
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke web with Playwright
        working-directory: web
        run: pnpm run test:smoke

      - name: Check web to AI service localhost communication
        shell: bash
        env:
          AI_SERVICE_INTERNAL_API_KEY: ci-internal-key
          AI_SERVICE_URL: http://127.0.0.1:8000
        run: |
          cd ai-service
          uv run uvicorn tuttoseriea_ai_service.main:app --host 127.0.0.1 --port 8000 &
          server_pid="$!"

          cleanup() {
            kill "$server_pid" >/dev/null 2>&1 || true
            wait "$server_pid" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health >/dev/null; then
              break
            fi

            if [ "$attempt" = "30" ]; then
              exit 1
            fi

            sleep 1
          done

          cd ../web
          pnpm run ai:client:check:live

      - name: Lint web
        working-directory: web
        run: pnpm run lint

      - name: Build web
        working-directory: web
        run: pnpm run build

      - name: Apply CI database migrations
        working-directory: web
        env:
          MIGRATION_DATABASE_URL: postgresql://tuttoseriea_ci:tuttoseriea_ci_password@127.0.0.1:5432/tuttoseriea_ci
        run: pnpm run db:migrate

      - name: Re-run CI database migrations
        working-directory: web
        env:
          MIGRATION_DATABASE_URL: postgresql://tuttoseriea_ci:tuttoseriea_ci_password@127.0.0.1:5432/tuttoseriea_ci
        run: pnpm run db:migrate

      - name: Check CI database migration state
        working-directory: web
        env:
          MIGRATION_DATABASE_URL: postgresql://tuttoseriea_ci:tuttoseriea_ci_password@127.0.0.1:5432/tuttoseriea_ci
        run: pnpm run db:migrations:check

      - name: Provision CI database runtime role
        working-directory: web
        env:
          MIGRATION_DATABASE_URL: postgresql://tuttoseriea_ci:tuttoseriea_ci_password@127.0.0.1:5432/tuttoseriea_ci
          DATABASE_APP_ROLE: tuttoseriea_ci_web
          DATABASE_APP_PASSWORD: tuttoseriea_ci_web_password
        run: pnpm run db:provision-role

      - name: Check CI runtime database access
        working-directory: web
        env:
          DATABASE_URL: postgresql://tuttoseriea_ci_web:tuttoseriea_ci_web_password@127.0.0.1:5432/tuttoseriea_ci
        run: pnpm run db:check

      - name: Check CI Auth.js adapter lifecycle
        working-directory: web
        env:
          DATABASE_URL: postgresql://tuttoseriea_ci_web:tuttoseriea_ci_web_password@127.0.0.1:5432/tuttoseriea_ci
        run: pnpm run db:auth:check

      - name: Check CI Identity RBAC foundation
        working-directory: web
        env:
          DATABASE_URL: postgresql://tuttoseriea_ci_web:tuttoseriea_ci_web_password@127.0.0.1:5432/tuttoseriea_ci
          MIGRATION_DATABASE_URL: postgresql://tuttoseriea_ci:tuttoseriea_ci_password@127.0.0.1:5432/tuttoseriea_ci
        run: pnpm run db:identity:check

      - name: Provision CI database seed role
        working-directory: web
        env:
          MIGRATION_DATABASE_URL: postgresql://tuttoseriea_ci:tuttoseriea_ci_password@127.0.0.1:5432/tuttoseriea_ci
          DATABASE_SEED_ROLE: tuttoseriea_ci_seed
          DATABASE_SEED_PASSWORD: tuttoseriea_ci_seed_password
        run: pnpm run db:provision-seed-role

      - name: Check CI seed role DDL denial
        working-directory: web
        env:
          SEED_DATABASE_URL: postgresql://tuttoseriea_ci_seed:tuttoseriea_ci_seed_password@127.0.0.1:5432/tuttoseriea_ci
        run: pnpm run db:seed:check-ddl-denied

      - name: Capture CI schema fingerprint before seed
        id: seed_schema_before
        working-directory: web
        shell: bash
        env:
          SEED_DATABASE_URL: postgresql://tuttoseriea_ci_seed:tuttoseriea_ci_seed_password@127.0.0.1:5432/tuttoseriea_ci
        run: echo "fingerprint=$(pnpm run --silent db:seed:schema-fingerprint)" >> "$GITHUB_OUTPUT"

      - name: Seed CI database
        working-directory: web
        env:
          SEED_DATABASE_URL: postgresql://tuttoseriea_ci_seed:tuttoseriea_ci_seed_password@127.0.0.1:5432/tuttoseriea_ci
        run: pnpm run db:seed

      - name: Re-run CI database seed
        working-directory: web
        env:
          SEED_DATABASE_URL: postgresql://tuttoseriea_ci_seed:tuttoseriea_ci_seed_password@127.0.0.1:5432/tuttoseriea_ci
        run: pnpm run db:seed

      - name: Compare CI schema fingerprint after seed
        working-directory: web
        shell: bash
        env:
          SEED_DATABASE_URL: postgresql://tuttoseriea_ci_seed:tuttoseriea_ci_seed_password@127.0.0.1:5432/tuttoseriea_ci
        run: |
          fingerprint_after="$(pnpm run --silent db:seed:schema-fingerprint)"
          if [ "${{ steps.seed_schema_before.outputs.fingerprint }}" != "$fingerprint_after" ]; then
            echo "Schema fingerprint changed during seed" >&2
            exit 1
          fi
          echo "schema_fingerprint_unchanged=true"

      - name: Check CI database migration state after seed
        working-directory: web
        env:
          MIGRATION_DATABASE_URL: postgresql://tuttoseriea_ci:tuttoseriea_ci_password@127.0.0.1:5432/tuttoseriea_ci
        run: pnpm run db:migrations:check

      - name: Prepare web image metadata
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "WEB_IMAGE=ghcr.io/${repository}/web" >> "$GITHUB_ENV"
          echo "WEB_IMAGE_TAG=sha-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build web container image
        run: |
          docker build \
            --build-arg COMMIT_SHA="${GITHUB_SHA}" \
            --file web/Dockerfile \
            --tag "${WEB_IMAGE}:${WEB_IMAGE_TAG}" \
            web

      - name: Smoke web container
        shell: bash
        run: |
          container_id="$(docker run --rm -d -p 3000:3000 "${WEB_IMAGE}:${WEB_IMAGE_TAG}")"

          cleanup() {
            docker stop "$container_id" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs "$container_id" || true
          exit 1

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login --username "${{ github.actor }}" --password-stdin ghcr.io

      - name: Push web container image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "${WEB_IMAGE}:${WEB_IMAGE_TAG}"

      - name: Inspect published web image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker buildx imagetools inspect "${WEB_IMAGE}:${WEB_IMAGE_TAG}"

  ai-service:
    name: AI Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ai-service/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install ai-service dependencies
        working-directory: ai-service
        run: uv sync --locked --dev

      - name: Check resolved ai-service dependencies
        working-directory: ai-service
        run: |
          uv run python --version
          uv run python -c "import fastapi, pydantic, uvicorn; print(f'fastapi={fastapi.__version__}'); print(f'pydantic={pydantic.__version__}'); print(f'uvicorn={uvicorn.__version__}')"

      - name: Lint ai-service
        working-directory: ai-service
        run: uv run ruff check .

      - name: Test ai-service
        working-directory: ai-service
        run: uv run pytest

      - name: Prepare ai-service image metadata
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "AI_SERVICE_IMAGE=ghcr.io/${repository}/ai-service" >> "$GITHUB_ENV"
          echo "AI_SERVICE_IMAGE_TAG=sha-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build ai-service container image
        run: |
          docker build \
            --build-arg COMMIT_SHA="${GITHUB_SHA}" \
            --file ai-service/Dockerfile \
            --tag "${AI_SERVICE_IMAGE}:${AI_SERVICE_IMAGE_TAG}" \
            ai-service

      - name: Smoke ai-service container
        shell: bash
        run: |
          container_id="$(docker run --rm -d -p 127.0.0.1:8000:8000 -e AI_SERVICE_INTERNAL_API_KEY=ci-internal-key "${AI_SERVICE_IMAGE}:${AI_SERVICE_IMAGE_TAG}")"

          cleanup() {
            docker stop "$container_id" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health >/dev/null; then
              break
            fi

            if [ "$attempt" = "30" ]; then
              docker logs "$container_id" || true
              exit 1
            fi

            sleep 1
          done

          curl --fail --silent --show-error \
            --header "X-Internal-API-Key: ci-internal-key" \
            http://127.0.0.1:8000/internal/health >/dev/null

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login --username "${{ github.actor }}" --password-stdin ghcr.io

      - name: Push ai-service container image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "${AI_SERVICE_IMAGE}:${AI_SERVICE_IMAGE_TAG}"

      - name: Inspect published ai-service image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker buildx imagetools inspect "${AI_SERVICE_IMAGE}:${AI_SERVICE_IMAGE_TAG}"
