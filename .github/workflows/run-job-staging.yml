name: Run Job Staging

run-name: Run STAGING job ${{ inputs.job_type }}

on:
  workflow_dispatch:
    inputs:
      job_type:
        description: Approved job type
        required: true
        type: choice
        options:
          - football.sync-serie-a-foundation
          - football.sync-serie-a-matches
          - football.sync-serie-a-standings
          - football.sync-serie-a-squads
          - football.sync-serie-a-player-statistics
          - football.sync-serie-a-match-events
          - football.sync-serie-a-match-lineups
          - football.sync-serie-a-match-statistics
      match_id:
        description: Lowercase Match UUID; required only for Match-scoped jobs
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: staging-run-job
  cancel-in-progress: false

jobs:
  run-job-staging:
    name: Run Staging Job
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.tuttoseriea.com/
    env:
      RUN_JOB_TYPE: ${{ inputs.job_type }}
      RUN_JOB_MATCH_ID: ${{ inputs.match_id }}
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
      STAGING_SSH_PORT: "56777"
      STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      STAGING_SSH_USER: deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run staging job
        shell: bash
        run: bash scripts/run-job-staging.sh
